<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Neural Circuit Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accent)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />

  <!-- CPU / Chip Center Base -->
  <rect x="160" y="160" width="192" height="192" rx="36" fill="#1e293b" stroke="url(#accent)" stroke-width="8" />

  <!-- Chip Pins -->
  <path d="M 200 130 L 200 160 M 256 130 L 256 160 M 312 130 L 312 160
           M 200 352 L 200 382 M 256 352 L 256 382 M 312 352 L 312 382
           M 130 200 L 160 200 M 130 256 L 160 256 M 130 312 L 160 312
           M 352 200 L 382 200 M 352 256 L 382 256 M 352 312 L 382 312" 
        stroke="url(#accent)" stroke-width="6" stroke-linecap="round" />

  <!-- Core AI Lightning Bolt Symbol -->
  <polygon points="275,190 215,270 250,270 235,325 295,245 260,245" fill="url(#glow)" />

  <!-- Surrounding Node Dots -->
  <circle cx="256" cy="86" r="12" fill="#38bdf8" />
  <circle cx="426" cy="256" r="12" fill="#818cf8" />
  <circle cx="256" cy="426" r="12" fill="#c084fc" />
  <circle cx="86" cy="256" r="12" fill="#38bdf8" />
</svg>
