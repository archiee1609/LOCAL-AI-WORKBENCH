[theme]
base = "dark"
primaryColor = "#00f2fe"
backgroundColor = "#060911"
secondaryBackgroundColor = "#0d1424"
textColor = "#f8fafc"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50
enableStaticServing = true

[browser]
gatherUsageStats = false
